name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          # Keine modules angeben: seit Qt 6.8 sind qtbase und qtsvg keine
          # Module, sondern Basis-Archive. aqt install-qt holzt sie mit dem
          # Grundpaket mit; "aqt list-qt linux desktop --modules 6.8.3" listet
          # nur die Addons auf und findet qtbase;qtsvg dort nicht - daher
          # lief der Schritt vorher mit "The packages ... were not found" ab.
          #
          # Dass das SVG-Archiv wirklich ankommt, prüft die Testsuite: der
          # Bildtest scheitert ohne Qt6::Svg, weil HRT_HAVE_SVG dann fehlt.
          cache: true

      - name: MSVC-Umgebung einrichten
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: CMake konfigurieren
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ steps.qt.outputs.qtpath }}

      - name: Bauen
        run: cmake --build build --config Release

      - name: Tests ausführen
        working-directory: build
        run: ctest --output-on-failure -C Release

      - name: Ausgebrochene Tests mit Exit-Code melden
        if: failure()
        shell: pwsh
        run: |
          foreach ($t in @('tst_catalogview', 'tst_startupflow')) {
            $exe = "build/$t.exe"
            if (-not (Test-Path $exe)) { continue }
            & $exe 2>&1 | Out-String | Write-Host
            Write-Host "DIAGNOSE $t exit=$LASTEXITCODE"
          }

      - name: Katalogwerkzeug prüfen
        shell: bash
        run: |
          set -euo pipefail
          TOOL=$(find build -name 'hrt-catalog-tool*' -type f | head -1)
          "$TOOL" data/catalogs/*.xml

      - name: Kataloge normalisierbar
        shell: bash
        run: |
          set -euo pipefail
          TOOL=$(find build -name 'hrt-catalog-tool*' -type f | head -1)
          # Fails if any catalog deviates from the canonical format, which would
          # mean that re-saving it produces a spurious diff.
          "$TOOL" --normalize data/catalogs/*.xml

      - name: Kataloge gegen das Schema prüfen
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          # xmllint gehoert nicht mehr zum Vorinstallierten des Runners.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils
          for f in data/catalogs/*.xml; do
            xmllint --noout --schema schema/catalog.xsd "$f"
          done

      - name: Installieren
        run: cmake --install build --prefix dist --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: HamRadioTrainer2026-${{ matrix.os }}
          path: dist
