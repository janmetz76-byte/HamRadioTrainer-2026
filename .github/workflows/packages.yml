# SPDX-License-Identifier: GPL-3.0-or-later
# HamRadioTrainer 2026 - Neu aufgebaut von Jan - DC6DX
#
# Baut die Installationspakete. Jedes Paket wird nach dem Bau geprüft: es muss
# die drei Kataloge und alle 687 Bilder enthalten, sonst findet das
# installierte Programm keine einzige Frage.
#
# Ein Versions-Tag (v0.1.0, ...) haengt die Pakete an das GitHub-Release
# dieser Version. Die Android-APK baut tools/android-build.sh lokal; sie
# kommt von Hand an dasselbe Release.

name: Pakete

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: DEB und RPM
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Qt installieren
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          # Keine modules: qtbase und qtsvg sind seit Qt 6.8 Basis-Archive und
          # kommen mit dem Grundpaket. Als Module angegeben, findet aqt sie
          # nicht und bricht ab. Die Bilder prueft die Testsuite.
          cache: true
        id: qt

      - name: Paketwerkzeuge installieren
        run: |
          sudo apt-get update
          # dpkg-dev liefert dpkg-shlibdeps fuer die Abhaengigkeiten des .deb,
          # rpm liefert rpmbuild fuer das .rpm.
          sudo apt-get install -y --no-install-recommends dpkg-dev rpm ninja-build

      - name: Qt-Bibliotheken fuer dpkg-shlibdeps auffindbar machen
        run: |
          # CPACK_DEBIAN_PACKAGE_SHLIBDEPS liest die Abhaengigkeiten aus den
          # gebauten Programmen. Die Qt-Bibliotheken liegen in einer
          # Aktions-Voreinstellung, die dem Linker-Suchpfad des Systems
          # unbekannt ist; ohne diesen Schritt schlaegt die Analyse fehl.
          qtlib="${{ env.QT_ROOT_DIR }}/lib"
          echo "Qt-Bibliotheken: $qtlib"
          echo "$qtlib" | sudo tee /etc/ld.so.conf.d/qt.conf
          sudo ldconfig
          ldconfig -p | grep -m1 libQt6Core.so.6

      - name: Konfigurieren
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=None
          -DCMAKE_PREFIX_PATH=${{ env.QT_ROOT_DIR }}
          -DCMAKE_INSTALL_PREFIX=/usr

      - name: Bauen
        run: cmake --build build

      - name: Testsuite
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      - name: Pakete bauen
        run: |
          cd build
          cpack -G DEB
          cpack -G RPM

      - name: Pakete pruefen
        run: |
          set -euo pipefail
          for paket in build/*.deb build/*.rpm; do
            echo "== $paket =="
            if [[ $paket == *.deb ]]; then
              inhalt=$(dpkg-deb -c "$paket")
              felder=$(dpkg-deb -f "$paket" Package Version Depends)
            else
              inhalt=$(rpm -qlp "$paket")
              felder=$(rpm -qip "$paket" | grep -E "^(Name|Version|License)")
              # "rpm -qip" zeigt niemals Abhaengigkeiten an, auch nicht mit
              # grep darauf. Die holt man sich gesondert, sonst prueft die
              # Zeile unten gegen eine leere Liste und meldet immer Qt als
              # fehlend.
              abhaengig=$(rpm -qp --requires "$paket")
            fi
            echo "$felder"
            # Die drei Kataloge muessen dabei sein.
            # Kein "echo | grep -q": grep -q bricht nach dem ersten Treffer ab,
            # echo bekommt eine kaputte Pipe und das Ganze faellt unter
            # "set -o pipefail" als Fehler durch - auch wenn der Katalog
            # drinsteht. Der Herestring liest die Liste nur.
            for klasse in N E A; do
              grep -q "de-amateurfunk-$klasse.xml" <<< "$inhalt" \
                || { echo "FEHLT: Katalog $klasse"; exit 1; }
            done
            # Und die Laufzeitabhaengigkeiten muessen Qt nennen. Aus einer
            # aqt-Installation laesst sich kein dpkg-Paket ableiten, darum
            # steht Qt hier nicht von allein drin (siehe CPACK_DEBIAN_PACKAGE_DEPENDS).
            if [[ $paket == *.deb ]]; then
              grep -qi "qt6" <<< "$felder" \
                || { echo "FEHLER: das deb nennt keine Qt-Laufzeitabhaengigkeit"; exit 1; }
            else
              echo "rpm verlangt: $abhaengig"
              grep -qi "qt6" <<< "$abhaengig" \
                || { echo "FEHLER: das rpm nennt keine Qt-Laufzeitabhaengigkeit"; exit 1; }
            fi
            # Und die Bilder, sonst waere jede Bildfrage unbrauchbar.
            bilder=$(echo "$inhalt" | grep -c '\.svg$')
            echo "Bilder im Paket: $bilder"
            [ "$bilder" -ge 687 ] || { echo "FEHLER: zu wenige Bilder"; exit 1; }
            echo "Desktop-Eintraege: $(echo "$inhalt" | grep -c '\.desktop$')"
          done

      - name: Hochladen
        uses: actions/upload-artifact@v4
        with:
          name: linux-pakete
          path: |
            build/*.deb
            build/*.rpm
          retention-days: 7

  windows:
    name: Windows Installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Qt installieren
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          # Wie im Linux-Schritt: keine modules, qtsvg steckt im Grundpaket.
          cache: true
        id: qt

      - name: NSIS installieren
        run: choco install nsis --no-progress -y

      - name: MSVC-Umgebung einrichten
        uses: ilammy/msvc-dev-cmd@v1

      - name: Konfigurieren
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ env.QT_ROOT_DIR }}
          -DCMAKE_INSTALL_PREFIX="C:/Program Files/HamRadioTrainer 2026"

      - name: Bauen
        run: cmake --build build --config Release

      - name: Testsuite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Testprotokolle bei Fehlern
        if: failure()
        shell: pwsh
        run: |
          # Unter Windows erscheint die Ausgabe der Qt-Tests nicht im
          # ctest-Protokoll. In eine Datei geschrieben ist sie lesbar.
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:PATH = "${env:QT_ROOT_DIR}\bin;${env:PATH}"
          Get-ChildItem build -Filter 'tst_*.exe' | ForEach-Object {
            $log = Join-Path (Resolve-Path build) "$($_.BaseName).log"
            Push-Location build
            & $_.FullName -o "$log,txt" | Out-Null
            Pop-Location
            if ($LASTEXITCODE -ne 0) {
              Write-Host "== $($_.Name): Rueckgabe $LASTEXITCODE =="
              if (Test-Path $log) { Get-Content $log | Select-String -NotMatch '^PASS' }
            }
          }

      - name: Installer und ZIP bauen
        run: cd build && cpack -G "NSIS;ZIP"

      - name: Inhalt des Installers pruefen
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "kein Installer erzeugt" }
          Write-Host "Installer: $($exe.Name) ($([math]::Round($exe.Length/1MB,1)) MB)"
          # Der Installer muss die Kataloge und die Qt-DLLs enthalten.
          $zip = "$($exe.FullName).zip"
          & "${env:ProgramFiles}\7-Zip\7z.exe" x $exe.FullName "-o$([IO.Path]::GetDirectoryName($zip))" | Out-Null

      - name: Hochladen
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            build/*.exe
            build/*.zip
          retention-days: 7

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pakete
          merge-multiple: true

      - name: An das Release haengen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l pakete
          # Gibt es das Release schon - etwa als Entwurf mit der APK -, kommen
          # die Pakete dazu. Sonst entsteht ein Entwurf, der erst nach einer
          # Durchsicht veroeffentlicht wird.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "HamRadioTrainer 2026 ${GITHUB_REF_NAME#v}" --notes ""
          fi
          gh release upload "$GITHUB_REF_NAME" pakete/* --clobber